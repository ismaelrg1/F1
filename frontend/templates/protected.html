<!-- templates/protected.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}F1 Predicciones{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style_race.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles_ranking.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/bets.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/normativa.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='scripts/socket.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/theme.js') }}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Botón de cambio de tema 🌙/🌞 -->
<button id="theme-toggle">🌙</button>
<button id="back-button" onclick="goBack()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 19L8 12L15 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</button>
<header>
    <h1>F1 Predicciones</h1>
    <nav>
        <a href="/home" >Home</a>
        <a href="{{ url_for('bets.apuestas') }}">Resultados</a>
        <a href="{{ url_for('ranking.ranking') }}">Ranking</a>
        <a href="{{ url_for('schedule.calendario') }}">Apuestas</a>
        <a href="{{ url_for('normativa.normativa') }}">Normativa</a>
    </nav>
</header>

<div class="content">
    {% block content %}{% endblock %}
</div>

<footer>
    <p>&copy; 2024 F1 Predicciones</p>
</footer>

<script src="{{ url_for('static', filename='scripts/header_footer_scroll.js') }}"></script>
</body>
</html>

<script>
    function goBack() {
        if (document.referrer) {
            window.history.back();
        } else {
            window.location.href = "/home"; // Redirigir a Home si no hay historial
        }
    }
</script>
