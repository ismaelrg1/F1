<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de la Carrera</title>
    <link rel="stylesheet" href="/static/style_race.css"> <!-- Asegúrate de vincular tu archivo CSS aquí -->
    <!-- Incluye el archivo JavaScript externo aquí -->
    <script src="{{ url_for('static', filename='scripts/showForm.js') }}" defer></script>
</head>
<body>
    <div class="container">
        <!-- Sección Qualy -->
        <section class="qualy">
            <h1>Qualy</h1>
            <div id="qualy-content">
                <!-- Aquí se mostrará el formulario o la tabla -->
                <!-- Modo Formulario -->
                <form id="qualy-form"  onsubmit="handleQualyFormSubmit(event)">
                    <label for="position1">Posición 1:</label>
                    <input type="text" id="position1" name="position1" required>

                    <label for="position2">Posición 2:</label>
                    <input type="text" id="position2" name="position2" required>

                    <label for="position3">Posición 3:</label>
                    <input type="text" id="position3" name="position3" required>

                    <!-- Agrega más posiciones según sea necesario -->

                    <button type="submit">Enviar Apuesta</button>
                </form>

                <!-- Modo Tabla -->
                <!-- Asegúrate de ocultar o mostrar el contenido adecuado con JavaScript o en el backend -->
                <table id="qualy-results" style="display: none;">
                    <thead>
                        <tr>
                            <th>Posición</th>
                            <th>Participante</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Participante 1</td>
                            <td>10</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Participante 2</td>
                            <td>8</td>
                        </tr>
                        <!-- Más filas según sea necesario -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Sección Carrera -->
        <section class="race">
            <h1>Carrera</h1>
            <div id="race-content">
                <!-- Aquí se mostrará el formulario o la tabla -->
                <!-- Modo Formulario -->
                <form id="race-form" action="/submit-race" method="POST">
                    <label for="position1">Posición 1:</label>
                    <input type="text" id="position1" name="position1" required>

                    <label for="position2">Posición 2:</label>
                    <input type="text" id="position2" name="position2" required>

                    <label for="position3">Posición 3:</label>
                    <input type="text" id="position3" name="position3" required>

                    <!-- Agrega más posiciones según sea necesario -->

                    <button type="submit">Enviar Apuesta</button>
                </form>

                <!-- Modo Tabla -->
                <!-- Asegúrate de ocultar o mostrar el contenido adecuado con JavaScript o en el backend -->
                <table id="race-results" style="display: none;">
                    <thead>
                        <tr>
                            <th>Posición</th>
                            <th>Participante</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Participante 1</td>
                            <td>25</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Participante 2</td>
                            <td>18</td>
                        </tr>
                        <!-- Más filas según sea necesario -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
